[project]
name = "grafcli"
version = "1.0.0"
description = "graf — the uvx launcher for the graf CLI binary (source: nabooai/graf, cli/)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
graf = "grafcli_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafcli_launcher"]
