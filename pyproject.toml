[project]
name = "grafcli"
version = "0.1.0"
description = "graf — query your organization's data graph from the command line (uvx launcher for the Go binary)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
graf = "grafcli_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafcli_launcher"]

# Ship the Go sources INSIDE the wheel so the launcher can `go build` the binary
# when no release asset is reachable (no GitHub token, an unreleased commit).
[tool.hatch.build.targets.wheel.force-include]
"main.go" = "grafcli_launcher/_src/main.go"
"go.mod" = "grafcli_launcher/_src/go.mod"
"go.sum" = "grafcli_launcher/_src/go.sum"
"cmd" = "grafcli_launcher/_src/cmd"
"internal" = "grafcli_launcher/_src/internal"
